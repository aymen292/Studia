<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="description" content="Studia — ton agenda de révisions intelligent, simple et hors-ligne." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Studia" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/style.css" />
  <title>Studia — Agenda de révisions</title>
</head>
<body>
  <div id="app" class="app">
    <div class="app-top">
      <nav class="top-nav" aria-label="Navigation principale">
        <button class="nav-item is-active" data-view="agenda" type="button">
          <span class="nav-icon" aria-hidden="true">▦</span>
          <span>Agenda</span>
        </button>
        <button class="nav-item" data-view="modules" type="button">
          <span class="nav-icon" aria-hidden="true">▤</span>
          <span>Mes UE</span>
        </button>
        <button class="nav-item" data-view="settings" type="button">
          <span class="nav-icon" aria-hidden="true">⚙</span>
          <span>Réglages</span>
        </button>
      </nav>

      <header class="app-header">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">S</span>
          <div class="brand-text">
            <strong>Studia</strong>
            <span id="modeBadge" class="mode-badge">Basique</span>
          </div>
        </div>
        <button id="helpBtn" class="icon-btn" type="button" aria-label="Aide" title="Aide">?</button>
      </header>
    </div>

    <main id="main" class="main" tabindex="-1"></main>
  </div>

  <div id="modalRoot" class="modal-root" hidden></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>
  <div id="onboardingRoot" class="onboarding-root" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
